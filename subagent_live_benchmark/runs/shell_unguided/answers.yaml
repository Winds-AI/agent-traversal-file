answers:
  - id: q01
    answer: 'Delegated approvals must record delegator, delegate, reason, and effective date range start and end. Permission changes must take effect within 2 minutes and stale sessions must be invalidated.'
  - id: q02
    answer: 'Global forms require idempotency keys on submission to prevent duplicate creates, store date values in UTC with local display formatting, and capture currency as explicit amount plus currency code.'
  - id: q03
    answer: 'S1 production outage or payment release blocked across multiple entities: 15 minute response, 4 hour workaround, hourly customer updates. S2 major degradation with workaround: 1 hour response, 1 business day workaround, updates every 4 hours.'
  - id: q04
    answer: 'Disaster recovery targets are RTO <= 4 hours and RPO <= 15 minutes. Backups must be encrypted and verified daily, and DR failover drills must run at least twice yearly, with point in time restore validation and post DR integration queue reconciliation.'
  - id: q05
    answer: 'In Integration Hub, the primary object is Connector Profile. Lifecycle states are Draft, Configured, Validated, Active, Degraded, Paused, and Retired. Core connector families are Identity or IdP, ERP or Accounting, OCR or E Invoice, Tax Engine, and Messaging, with ITSM also defined as an integration package.'
  - id: q06
    answer: 'Rollout is pilot first: R1 internal sandbox and IT readiness, R2 single entity pilot, R3 expansion to similar entities, R4 global rollout with localization packs. Governance meetings are weekly during active rollout and biweekly after stabilization.'
  - id: q07
    answer: 'SoD separates AP processing from payment release: AP Processor handles invoice intake and matching plus payment proposal preparation, while Finance Controller approves payment batches and policy exceptions. Users with invoice entry rights cannot release payment batches without secondary approval.'
  - id: q08
    answer: 'After requisition submission, the system runs policy checks for catalog compliance, budget availability, mandatory fields, and fiscal lock or master data validity, then routes approval by amount, category, and organizational hierarchy. Only approved requisitions convert to a PO or contract release.'
  - id: q09
    answer: 'Invoice workflow is intake via OCR, EDI, portal, or email, then normalization of header and line data, then two way or three way matching, then exception coding and Match Case handling, then AP resolution or dispute routing and escalation until resolved and closed.'
  - id: q10
    answer: 'When a sync job fails, Integration Hub surfaces run history and row errors and applies retry or replay controls. The failure must raise an operational incident or support case, send integration.job.failed notifications to connector owner and Support Ops, and follow support playbook triage and escalation by severity.'
  - id: q11
    answer: 'Phase gates require training completion, KPI baseline, integration stability, and support readiness before rollout advances. After each wave, 4 week hypercare requires daily triage and twice weekly KPI reviews against success metrics, and exit requires stable KPI trends and manageable support volume.'
  - id: q12
    answer: 'Analytics and audit exports must enforce privacy by masking PII unless explicitly authorized, and export rights are separate from dashboard view rights. Audit evidence exports must preserve traceability with immutable events, signed digests and hash references, plus attachment manifests.'
  - id: q13
    answer: 'Notification reliability uses in app, email, and webhook channels, with SMS optional and disabled by default, and critical finance events requiring at least two channels. Digest and quiet hours apply only to non critical events with immediate, hourly, or daily digest options. Retries run at 1 minute, 5 minutes, 30 minutes, and 2 hours; critical delivery failure alerts operations within 5 minutes, and final failure opens a support case with payload snapshot.'
  - id: q14
    answer: 'I 001 Identity: inbound users, groups, status from IdP, outbound none. I 002 ERP or Accounting: outbound approved POs, receipt accruals, payment statuses; inbound vendor master, chart of accounts, cost centers, fiscal periods. I 003 OCR or E Invoice: inbound extracted invoice data and confidence; outbound correction feedback. I 004 Tax Engine: outbound taxable context and jurisdiction metadata; inbound tax and exemption results. I 005 Messaging: outbound templated email and webhooks; inbound delivery receipts and bounces. I 006 ITSM: outbound incidents and support cases; inbound ticket status updates.'
  - id: q15
    answer: 'Performance targets are P95 page load <= 2.5 seconds for list pages and <= 3.5 seconds for detail pages, P95 API <= 800 ms for reads and <= 1200 ms for writes, bulk import validation >= 20000 rows per hour per tenant, matching >= 50000 invoice lines per hour, monthly report pack <= 10 minutes for a 24 month window, and search first page <= 2 seconds.'
  - id: q16
    answer: 'Migration phases are M1 source profiling and template mapping, M2 staging dry run with reconciliation, M3 business validation signoff, M4 production cutover load, and M5 post load reconciliation and defect remediation. Data quality controls include file checksum and schema version, blocking checks for missing legal entity, invalid currency, and orphan references, warning checks for text truncation or oversize attachments, reconciliation of counts, currency totals, and status distributions, and record to source audit linkage by batch id.'
  - id: q17
    answer: 'Go live controls include identity readiness GL 002 SSO and role mapping validation with live users, integration readiness GL 003 connector credential rotation and smoke tests, migration readiness GL 004 load completion and reconciliation signoff, reporting readiness GL 006 schedule and recipient verification, and support readiness GL 007 hypercare on call roster confirmation plus support channel communication in GL 010.'
  - id: q18
    answer: 'Support operates in Tier 1 customer helpdesk, Tier 2 product support, and Tier 3 engineering escalation. Intake channels are in app form, email, and ITSM ticket creation. Required case data is tenant, module, severity, impact, and reproducibility. Communication cadence is S1 hourly, S2 every 4 hours, and S3 daily, with incident commander assignment for high severity.'
