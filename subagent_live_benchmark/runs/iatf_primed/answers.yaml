answers:
  - id: q01
    answer: "Delegated approval records must capture delegator, delegate, reason, and effective date range (start/end dated delegation). Permission changes must propagate within 2 minutes and invalidate stale sessions."
  - id: q02
    answer: "Duplicate submissions are prevented by mandatory idempotency keys on every form submit/retry. Dates are stored in UTC with local display formatting. Currency fields must store both amount and currency code, with standardized precision (2 decimals for currency, 4 for quantity conversions)."
  - id: q03
    answer: "S1 (production outage/payment release blocked): response 15 minutes, workaround 4 hours, customer updates hourly. S2 (major degradation with workaround): response 1 hour, workaround 1 business day, customer updates every 4 hours."
  - id: q04
    answer: "DR targets are RTO <= 4 hours and RPO <= 15 minutes. Backups must be encrypted and verified daily. DR failover drills must run at least twice per year."
  - id: q05
    answer: "In Integration Hub, the primary object is Connector Profile. Lifecycle states are Draft, Configured, Validated, Active, Degraded, Paused, and Retired. Core connector dependencies are ERP/accounting, tax, OCR/e-invoice, identity provider (IdP), and messaging connectors (with ITSM defined as an integration package in the platform set)."
  - id: q06
    answer: "Rollout moves R1 internal sandbox and IT admin readiness -> R2 pilot (one legal entity, limited departments) -> R3 expansion to similar entities -> R4 global rollout with localization packs. Governance cadence is weekly during active rollout and biweekly after stabilization."
  - id: q07
    answer: "Role design separates AP processing from payment release: AP Processor handles invoices/matching/payment proposal prep, while Finance Controller approves payment batches. SoD control enforces that users with invoice-entry rights cannot release payment batches without secondary approval."
  - id: q08
    answer: "After submission, requisitions run policy validation (mandatory fields, catalog compliance, budget/funds checks, fiscal-period lock checks, permission checks). The workflow engine then routes approvals by amount, category, and org hierarchy using configured multi-step rules (including fallback/escalation/delegation). Only approved demand is allowed to generate a Purchase Order."
  - id: q09
    answer: "Invoices are ingested (OCR/EDI/portal/email), then normalized for matching. The matching engine runs 2-way/3-way checks and creates exception codes/cases when variances occur. AP then resolves exceptions or routes disputes, with match cases progressing through states such as Pending/In Review/Exception/Resolved/Escalated/Closed."
  - id: q10
    answer: "When a sync job fails, Integration Hub surfaces run history/row errors and supports replay; failures trigger the integration.job.failed event, notifying connector owner and support operations. The platform must open/route an operational support incident, retry per policy (including backoff/idempotent handling), and escalate through support communication rules if severity is high."
  - id: q11
    answer: "Each rollout phase gate requires training completion, KPI baseline readiness, integration stability, and support readiness. After each wave, hypercare runs for 4 weeks with daily incident/SLA triage and twice-weekly KPI reviews against success metrics; KPI ownership remains accountable, and exit requires stable KPI trends plus manageable support volume."
  - id: q12
    answer: "Analytics exports are governed by export policy/scheduling controls and secure delivery constraints, while audit evidence exports must include signed event digests/manifests. Privacy controls require PII masking in exports unless explicitly authorized, and audit controls require immutable append-only traceability (including hashes/correlation data) so exported evidence is both privacy-compliant and verifiable."
  - id: q13
    answer: "Channels are in-app, email, and webhook (SMS optional/off by default). Critical finance events require at least two channels and bypass digest/quiet-hour suppression. Non-critical events can use immediate/hourly/daily digest modes. Delivery retries occur at 1 minute, 5 minutes, 30 minutes, and 2 hours; after final failure, the system opens a support case and attaches the payload snapshot."
  - id: q14
    answer: "I-001 Identity: inbound users/groups/status from IdP, outbound none. I-002 ERP/Accounting: inbound vendor master/COA/cost centers/fiscal periods, outbound approved POs/receipt accruals/payment statuses. I-003 OCR/E-Invoice: inbound extracted invoice candidates/confidence, outbound correction feedback. I-004 Tax Engine: inbound tax calculation/exemption validation, outbound taxable line/jurisdiction context. I-005 Messaging: inbound delivery receipts/bounces, outbound templated emails/webhooks. I-006 ITSM: inbound ticket status updates, outbound incidents/support cases."
  - id: q15
    answer: "Performance targets: P95 UX load <= 2.5s (list) and <= 3.5s (detail); P95 API <= 800ms reads and <= 1200ms writes; bulk import >= 20,000 rows/hour/tenant; matching throughput >= 50,000 invoice lines/hour; standard 24-month monthly report pack <= 10 minutes; search first page <= 2 seconds."
  - id: q16
    answer: "Migration phases are M1 template mapping/source profiling, M2 staging dry run with reconciliation reports, M3 business validation signoff, M4 production cutover load, and M5 post-load reconciliation/remediation. Data-quality controls include per-file checksum + schema version, blocking rules (missing legal entity, invalid currency, orphan references), warning rules, and reconciliation checks on counts, currency totals, and status distributions with record-level source/import audit linkage."
  - id: q17
    answer: "Go-live controls include: identity readiness (SSO and role mapping validated with live users), integration readiness (connector credentials rotated and smoke tests passed), migration readiness (load complete and reconciliation signed off), reporting readiness (schedules and recipients verified), and support readiness (hypercare on-call roster confirmed)."
  - id: q18
    answer: "Support operates as Tier 1 helpdesk, Tier 2 product support, and Tier 3 engineering escalation. Intake channels are in-app form, email, and ITSM ticket integration. Mandatory case data includes tenant, module, severity, impact, and reproducibility. Severity communication cadence is S1 hourly, S2 every 4 hours, and S3 daily (with incident commander assignment for high-severity cases)."
